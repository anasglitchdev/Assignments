<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeStore API — Shop</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface-2);
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: contain;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
        }

        .product-info {
            padding: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .product-title {
            font-size: 12px;
            color: var(--text-dim);
            margin: 0 0 8px;
            line-height: 1.4;
            min-height: 32px;
            flex: 1;
        }

        .product-price {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent-2);
            margin: 0;
        }

        .loading {
            text-align: center;
            color: var(--text-faint);
            padding: 40px 20px;
        }

        .error-message {
            color: var(--danger);
            text-align: center;
            padding: 20px;
            background: rgba(255, 107, 122, 0.1);
            border: 1px solid rgba(255, 107, 122, 0.3);
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="site-nav">
            <a href="index.html">&larr; directory</a>
            <span class="tag">num12.html</span>
        </div>

        <div class="term">
            <div class="term-bar">
                <span class="term-dot r"></span>
                <span class="term-dot y"></span>
                <span class="term-dot g"></span>
                <span class="term-title">FakeStore API — Shop</span>
            </div>
            <div class="term-body">
                <h1>FakeStore Shop</h1>
                <p>Browse products from the FakeStore API. Live product catalog with real-time pricing.</p>
                <hr>
                <div id="itemCards" class="product-grid"></div>
            </div>
        </div>
    </div>
</body>
<script>
    let itemCards = document.getElementById("itemCards")

    let renderCards = () => {
        itemCards.innerHTML = '<div class="loading">Loading products...</div>'
        fetch('https://fakestoreapi.com/products')
            .then(response => response.json())
            .then(data => {
                itemCards.innerHTML = ""
                console.log(data);
                data.forEach((product) => {
                    let card = `<div class="product-card">
                        <img src="${product.image}" alt="${product.title}" class="product-image">
                        <div class="product-info">
                            <h3 class="product-title">${product.title}</h3>
                            <p class="product-price">$${product.price.toFixed(2)}</p>
                        </div>
                    </div>`
                    itemCards.innerHTML += card
                })
            })
            .catch(error => {
                itemCards.innerHTML = '<div class="error-message">Failed to load products. Please try again.</div>'
                console.error('Error:', error)
            })
    }
    renderCards()   
</script>
</html>
