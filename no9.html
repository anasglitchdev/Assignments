<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Event Countdown and Duration Calender</h1>
    <hr>
    <span>Add Today's Date </span><input type="date" id="userCurrentDate"/>
    <br>
    <span>Date Of Future Event </span><input type="date" id="userEventDate"/>
    <button id="timeDifference">Calculate Remaining time</button>
    <div id="time_div"></div>
</body>
<script>
    let userCurrentDate = document.getElementById("userCurrentDate")
    let userEventDate = document.getElementById("userEventDate")
    let timeDifference = document.getElementById("timeDifference")
    let time_div = document.getElementById("time_div")

    let renderTime = () => {
        time_div.innerHTML = ""
        let now = new Date(userCurrentDate.value)
        let event = new Date(userEventDate.value)

        let milisecsTillNow = now.getTime()
        let milisecsTillEvent = event.getTime()

        let milliseconds = milisecsTillEvent - milisecsTillNow
        if(milliseconds > 0){
            let seconds = milliseconds / 1000
            let minutes = milliseconds / 1000 / 60
            let hours = milliseconds / 1000 / 60 / 60
            let days = milliseconds / 1000 / 60 / 60 / 24
            let months = milliseconds / 1000 / 60 / 60 / 24 / 30
            let years = milliseconds / 1000 / 60 / 60 / 24 / 30 / 12
            
            time_div.innerHTML += "<p>" + Math.floor(years) + " Years and " + Math.floor(months) + " Months"
            time_div.innerHTML += "<p>" + Math.floor(days) + " Days : " + Math.floor(hours) + " Hours : " + Math.floor(minutes) + " Minutes : " + Math.floor(seconds) + " Seconds : " + Math.floor(milliseconds) + " Miliseconds"
        } else{
            time_div.innerHTML += "<p> This event has already passed : Failed to generate </p>"
        }
    }
    timeDifference.addEventListener("click", renderTime)
</script>
</html>
