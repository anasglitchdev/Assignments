<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11 — Objects</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-nav"><a href="index.html">&larr; directory</a><span class="tag">num11.html</span></div>
    <div class="term">
        <div class="term-bar">
            <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
            <span class="term-title">num11.html — objects</span>
        </div>
        <div class="term-body">
            <h1>Country Flags Registry</h1>
            <p>// track every country and its flag</p>
            <hr>
            <input type="text" placeholder="Country Name" id="country_name">
            <input type="text" placeholder="Continent" id="continent">
            <input type="url" placeholder="Flag Image URL" id="flag_img">
            <button id="addCountryBtn">Add Country</button>
            <div id="countries_list"></div>
        </div>
    </div>

    <script>
        let countries_list = document.getElementById("countries_list")
        let country_name = document.getElementById("country_name")
        let continent = document.getElementById("continent")
        let flag_img = document.getElementById("flag_img")
        let add_country_btn = document.getElementById("addCountryBtn")

        let countries = [
            { flag: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKZkAmyIv1X6zc5BgKpciT5L4PhxNwfXpjexVa06Ghhw&s=10", name: "Pakistan", continent: "Asia" },
            { flag: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQY9y7busPbEAkXACpSxNpKmh0SNhJBt73FvVtYxC-w4w&s=10", name: "Liechtenstein", continent: "Europe" },
            { flag: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTTZtJfN8Twm_ixkYUo0ZWTMv3mGWym_E0GvuEhUCmmFw&s", name: "Tanzania", continent: "Africa" },
        ]

        let renderCountries = () => {
            countries_list.innerHTML = ""
            if (countries.length === 0) {
                countries_list.innerHTML = "<p>No countries added yet.</p>"
                return
            }
            countries.forEach((data) => {
                countries_list.innerHTML += `
                    <div style="display:flex; align-items:center; gap:12px; margin:8px 0;">
                        <img src="${data.flag}" height="40" style="border-radius:4px; border:1px solid var(--border);" onerror="this.src='https://placehold.co/60x40/0d131c/7c8aa3?text=?'"/>
                        <span style="color:var(--text)">${data.name}</span>
                        <span style="color:var(--text-faint); font-size:12px;">${data.continent}</span>
                    </div>`
            })
            countries_list.innerHTML += `<p style="color:var(--text-faint); font-size:12px; margin-top:12px;">Total: ${countries.length} countries</p>`
        }

        renderCountries()

        let addCountry = () => {
            if (!country_name.value.trim() || !continent.value.trim()) return
            countries.push({
                flag: flag_img.value || "https://placehold.co/60x40/0d131c/7c8aa3?text=?",
                name: country_name.value,
                continent: continent.value
            })
            renderCountries()
            country_name.value = ""
            continent.value = ""
            flag_img.value = ""
            country_name.focus()
        }

        add_country_btn.addEventListener("click", addCountry)
    </script>
</body>
</html>
